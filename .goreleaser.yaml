# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: outaspace

builds:
  - id: outaspace-linux
    main: .
    binary: OutaSpace
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    # Wails needs these tags; webkit2_41 targets libwebkit2gtk-4.1 (Ubuntu 24.04+).
    tags:
      - desktop
      - production
      - webkit2_41
    flags:
      - -trimpath
    ldflags:
      - -s -w

nfpms:
  - id: outaspace-pkgs
    package_name: outaspace
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: "Plumbago Development"
    homepage: "https://github.com/plumbago-dev/OutaSpace"
    maintainer: "Plumbago Development <contact@plumbago.dev>"
    description: "Visual Disk Space Analyzer with Real-Time Rain and Interactive Treemaps"
    license: "GPL-3.0"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
    overrides:
      rpm:
        dependencies:
          - gtk3
          - webkit2gtk4.1
    contents:
      - src: build/appicon.png
        dst: /usr/share/icons/hicolor/256x256/apps/outaspace.png
      - src: build/linux/outaspace.desktop
        dst: /usr/share/applications/outaspace.desktop

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: plumbago-dev
    name: OutaSpace
  extra_files:
    - glob: "./extra-files/*"