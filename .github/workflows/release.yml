name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release Title (optional, defaults to tag name)"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Release Notes / Description (optional)"
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Create as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require vMAJOR.MINOR.PATCH
        run: |
          if [[ ! "${{ inputs.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag_name '${{ inputs.tag_name }}' must look like v1.2.3 (no suffixes)"
            exit 1
          fi

  build-windows:
    name: Build Windows Artifacts (EXE, NSIS Installer & MSIX)
    needs: [validate-tag]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: pwsh
        run: |
          # The tag is the single source of truth; wails.json's productVersion is a
          # placeholder in the repo and is overwritten here (not committed).
          $v = "${{ inputs.tag_name }}" -replace '^v', ''
          $j = Get-Content wails.json -Raw | ConvertFrom-Json
          $j.info.productVersion = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          # Wails silently skips the installer if makensis isn't on PATH, so install it
          # explicitly and put it on PATH for the following steps.
          choco install nsis -y --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) { throw "makensis.exe not found in $nsisDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Build Windows Executable & NSIS Installer
        shell: pwsh
        run: |
          # -nsis additionally produces build\bin\OutaSpace-amd64-installer.exe via makensis.
          # This is the artifact WinGet installs from — it doesn't require code signing
          # to install, unlike MSIX below.
          wails build -platform windows/amd64 -nsis
          Get-ChildItem build\bin
          if (-not (Test-Path "build\bin\OutaSpace-amd64-installer.exe")) {
            throw "NSIS installer was not produced by wails build"
          }

      - name: Build Windows MSIX Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build\bin\OutaSpace.exe" -Destination "dist\OutaSpace-windows-amd64.exe"
          Copy-Item "build\bin\OutaSpace-amd64-installer.exe" -Destination "dist\OutaSpace-windows-amd64-installer.exe"
          powershell -ExecutionPolicy Bypass -File build\windows\msix\generate-msix.ps1 -Version "${{ inputs.tag_name }}" -OutputDir "dist"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Artifact (DMG)
    needs: [validate-tag]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = "${{ inputs.tag_name }}" -replace '^v', ''
          $j = Get-Content wails.json -Raw | ConvertFrom-Json
          $j.info.productVersion = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS Universal App
        run: |
          wails build -platform darwin/universal

      - name: Package DMG
        run: |
          brew install create-dmg || true
          mkdir -p dist

          if command -v create-dmg > /dev/null; then
            create-dmg \
              --volname "OutaSpace" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "OutaSpace.app" 175 190 \
              --hide-extension "OutaSpace.app" \
              --app-drop-link 425 190 \
              "dist/OutaSpace-darwin-universal.dmg" \
              "build/bin/OutaSpace.app" || hdiutil create -volname "OutaSpace" -srcfolder "build/bin/OutaSpace.app" -ov -format UDZO "dist/OutaSpace-darwin-universal.dmg"
          else
            hdiutil create -volname "OutaSpace" -srcfolder "build/bin/OutaSpace.app" -ov -format UDZO "dist/OutaSpace-darwin-universal.dmg"
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    name: Release & Package (GoReleaser, DEB, RPM)
    runs-on: ubuntu-22.04
    needs: [build-windows, build-macos]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::Retries=2 update -y
          sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::Retries=2 install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            libgtk-3-dev libwebkit2gtk-4.0-dev file

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: extra-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: extra-files

      - name: Prepare Git State for GoReleaser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git tag -a "${{ inputs.tag_name }}" -m "Release ${{ inputs.tag_name }}" || true

      - name: Run GoReleaser (Package DEB, RPM, & Publish Release)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag_name }}


  update-winget:
    name: Update WinGet manifest hash
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hash the asset actually served from the release, since that is what WinGet downloads.
          gh release download "${{ inputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "OutaSpace-windows-amd64-installer.exe" \
            --dir installer

      - name: Update manifest version, URL and SHA256
        shell: pwsh
        run: |
          ./scripts/update-winget-manifest.ps1 -Version "${{ inputs.tag_name }}" -InstallerPath "installer/OutaSpace-windows-amd64-installer.exe"

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add winget/
          if git diff --cached --quiet; then
            echo "Manifests already up to date."
            exit 0
          fi
          git commit -m "chore: update WinGet manifest for ${{ inputs.tag_name }}"
          git pull --rebase origin main
          git push origin main
